[package]
name = "pinshot"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PinShot Windows app: tray, overlay, pins (winit + tiny-skia + Win32)"
rust-version.workspace = true

[[bin]]
name = "pinshot"
path = "src/main.rs"

[features]
default = []
ocr = ["dep:ort"]

[dependencies]
pinshot-core = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
softbuffer = "0.4"
tiny-skia = { workspace = true }
tray-icon = "0.19"
arboard = { version = "3.4", default-features = false, features = ["image-data", "windows-sys"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
raw-window-handle = "0.6"
thiserror = { workspace = true }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
uiautomation = "0.22"
ort = { version = "=2.0.0-rc.10", optional = true, default-features = false, features = ["download-binaries", "std"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Controls_Dialogs",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Storage_Xps",
    "Win32_UI_Accessibility",
] }
