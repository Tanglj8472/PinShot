[package]
name = "pinshot"
build = "build.rs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PinShot app: tray/fallback, overlay, pins (winit + tiny-skia)"
rust-version.workspace = true

[[bin]]
name = "pinshot"
path = "src/main.rs"

[features]
default = []
lite = []
ocr = ["dep:ort", "dep:paddle-ocr-rs"]
# NVIDIA CUDA 12 ONNX Runtime. Do not combine with WebGPU (pyke then
# downloads the CPU `none` flavor). WebGPU/Dawn is Windows-only so the
# Linux release binary does not DT_NEEDED libwebgpu_dawn.so.
ocr-cuda = ["ocr", "ort/cuda"]
ocr-directml = ["ocr", "ort/directml"]
ocr-webgpu = ["ocr", "ort/webgpu"]

[dependencies]
pinshot-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
ring = "0.17"
md-5 = "0.10"
fs2 = "0.4"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11"] }
softbuffer = "0.4"
tiny-skia = { workspace = true }
arboard = { version = "3.4", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
raw-window-handle = "0.6"
thiserror = { workspace = true }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = "0.19"
ort = { version = "=2.0.0-rc.10", optional = true, default-features = false, features = ["download-binaries", "std"] }
paddle-ocr-rs = { version = "0.6.1", optional = true, default-features = false, features = ["download-binaries"] }

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.10", optional = true, default-features = false, features = ["download-binaries", "std", "copy-dylibs"] }
arboard = { version = "3.4", default-features = false, features = ["image-data", "windows-sys"] }
uiautomation = "0.22"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Controls_Dialogs",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Storage_Xps",
    "Win32_UI_Accessibility",
] }

[target.'cfg(unix)'.dependencies]
x11rb = { version = "0.13", default-features = true, features = ["allow-unsafe-code"] }
libc = "0.2"
gtk = "0.18"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["download-binaries", "std"] }
paddle-ocr-rs = { version = "0.6.1", default-features = false, features = ["download-binaries"] }
