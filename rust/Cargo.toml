[workspace]
resolver = "2"
members = ["crates/pinshot-core", "crates/pinshot"]

[workspace.package]
version = "0.2.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/Tanglj8472/pinshot"
rust-version = "1.85"

[workspace.dependencies]
pinshot-core = { path = "crates/pinshot-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tiny-skia = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
