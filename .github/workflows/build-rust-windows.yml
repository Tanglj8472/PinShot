name: build-rust-windows

on:
  push:
    branches: [main]
    tags: ['v*-windows-rust']
  pull_request:
    paths:
      - "rust/**"
      - "tools/package-windows.ps1"
      - "tools/test-windows-upgrade.ps1"
      - "tools/test-windows-runtime.ps1"
      - "tools/test-windows-clean-runtime.ps1"
      - "packaging/**"
      - ".github/workflows/build-rust-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --locked --workspace
      - name: cargo test with OCR
        run: cargo test --locked --workspace --features ocr
      - name: cargo build --release (no OCR)
        run: cargo build --release --bin pinshot
      - name: version smoke
        shell: pwsh
        run: |
          $out = (& .\target\release\pinshot.exe --version | Out-String).Trim()
          Write-Host $out
          if ($out -notmatch "PinShot .*windows-rust") { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: pinshot.exe
          path: rust/target/release/pinshot.exe
          if-no-files-found: error

      - name: cargo build --release --features ocr
        run: cargo build --release --bin pinshot --features ocr
      - name: stage pinshot-ocr.exe
        shell: pwsh
        run: |
          Copy-Item -Force .\target\release\pinshot.exe .\target\release\pinshot-ocr.exe
          $out = (& .\target\release\pinshot-ocr.exe --version | Out-String).Trim()
          Write-Host $out
          if ($out -notmatch "PinShot .*windows-rust") { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: pinshot-ocr.exe
          path: rust/target/release/pinshot-ocr.exe
          if-no-files-found: error

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Package installer and portable ZIP
        shell: pwsh
        run: ../tools/package-windows.ps1 -SkipTests
      - name: Installation, update and configuration regression tests
        shell: pwsh
        run: |
          $stage = Get-ChildItem ../dist -Directory -Filter 'stage-*' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $payload = (Get-ChildItem -LiteralPath $stage.FullName -Directory | Select-Object -First 1).FullName
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $iscc = if ($compiler) { $compiler.Source } else { Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe' }
          ../tools/test-windows-upgrade.ps1 -PayloadDir $payload -Iscc $iscc
          ../tools/test-windows-upgrade.ps1 -PayloadDir $payload -Iscc $iscc -FreshInstall
          ../tools/test-windows-upgrade.ps1 -PayloadDir $payload -Iscc $iscc -FreshInstall -RetryShutdown
          ../tools/test-windows-upgrade.ps1 -PayloadDir $payload -Iscc $iscc -RejectShutdown
          ../tools/test-windows-upgrade.ps1 -PayloadDir $payload -Iscc $iscc -RestartAfterInstall
          ../tools/test-windows-upgrade.ps1 -PayloadDir $payload -Iscc $iscc -UpdateHelper
      - name: Sign installer when certificate is configured
        working-directory: .
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if ($env:WINDOWS_SIGNING_CERT_BASE64) {
            ./tools/sign-windows-release.ps1 -DistDir ./dist -CertificateBase64 $env:WINDOWS_SIGNING_CERT_BASE64 -CertificatePassword $env:WINDOWS_SIGNING_CERT_PASSWORD
          } else {
            Add-Content -LiteralPath ./dist/SHA256SUMS.txt -Value "`n# Authenticode: not signed (certificate not configured in CI)"
            Write-Host 'No Windows signing certificate configured; publishing SHA256-only package.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: pinshot-windows-x64-packages
          path: |
            dist/*-setup.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  lite:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Lite
        run: cargo test --locked --workspace --features lite
      - name: Verify Lite excludes inference dependencies
        shell: pwsh
        run: |
          $deps = cargo tree --locked -p pinshot --target x86_64-pc-windows-msvc --no-default-features --features lite
          if ($LASTEXITCODE -ne 0) { throw 'Dependency inspection failed' }
          if ($deps -match '(?m)\\b(ort|ort-sys|paddle-ocr-rs) v') { throw 'Lite contains inference dependencies' }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build and package Lite for Windows 10 1809
        shell: pwsh
        run: ../tools/package-windows.ps1 -Lite -SkipTests
      - name: Verify Lite rejects MCP startup
        shell: pwsh
        run: |
          $stage = Get-ChildItem ../dist -Directory -Filter 'stage-*' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $payload = (Get-ChildItem -LiteralPath $stage.FullName -Directory | Select-Object -First 1).FullName
          $exe = Join-Path $payload 'pinshot.exe'
          foreach ($argument in @('--automation', '--capture-to')) {
            $process = Start-Process -FilePath $exe -ArgumentList $argument -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(15000)) { $process.Kill(); throw "Lite unexpectedly remained running: $argument" }
            if ($process.ExitCode -ne 2) { throw "Lite must reject MCP startup: $argument ($($process.ExitCode))" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: pinshot-lite-windows-x64-packages
          path: |
            dist/*-lite-setup.exe
            dist/*-lite.zip
            dist/SHA256SUMS-lite.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, lite]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pinshot-windows-x64-packages
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: pinshot-lite-windows-x64-packages
          path: dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PinShot ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
