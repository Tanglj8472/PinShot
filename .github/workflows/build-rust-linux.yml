name: build-rust-linux

on:
  push:
    branches: [rust]
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/build-rust-linux.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: apt X11 / GTK / xdo
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential pkg-config \
            libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb-xkb-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-randr0-dev libxcb-shm0-dev libxrandr-dev libxi-dev \
            libxext-dev libxcursor-dev libxinerama-dev libxdo-dev \
            libgtk-3-dev libayatana-appindicator3-dev \
            libclang-dev libssl-dev fonts-wqy-microhei
          # rust-lld looks for libstdc++.so in the multiarch dir (ort on Linux).
          if [ ! -e /usr/lib/x86_64-linux-gnu/libstdc++.so ]; then
            so=$(ls /usr/lib/gcc/x86_64-linux-gnu/*/libstdc++.so 2>/dev/null | head -1)
            if [ -n "$so" ]; then sudo ln -sf "$so" /usr/lib/x86_64-linux-gnu/libstdc++.so; fi
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test --workspace
        run: cargo test --workspace
      - name: cargo build --release (x86_64-unknown-linux-gnu host)
        run: cargo build --release --bin pinshot
      - name: version smoke
        run: |
          out="$(./target/release/pinshot --version)"
          echo "$out"
          echo "$out" | grep -E "PinShot .*linux-rust"
          rustc -vV | grep -E "host: x86_64-unknown-linux-gnu"
      - uses: actions/upload-artifact@v4
        with:
          name: pinshot-linux
          path: rust/target/release/pinshot
          if-no-files-found: error
